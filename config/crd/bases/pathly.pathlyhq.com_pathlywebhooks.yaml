apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pathlywebhooks.pathly.pathlyhq.com
spec:
  group: pathly.pathlyhq.com
  names:
    kind: PathlyWebhook
    listKind: PathlyWebhookList
    plural: pathlywebhooks
    shortNames: [pwh]
    singular: pathlywebhook
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [connectionRef, url]
              properties:
                connectionRef:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                url: { type: string }
                events:
                  type: array
                  items: { type: string }
            status:
              type: object
              properties:
                id: { type: string }
                events:
                  type: array
                  items: { type: string }
                enabled: { type: boolean }
                hasSecret: { type: boolean }
                urlFingerprint: { type: string }
                createdAt: { type: string }
                ready: { type: boolean }
                message: { type: string }
                observedGeneration: { type: integer, format: int64 }
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: ID
          type: string
          jsonPath: .status.id
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
