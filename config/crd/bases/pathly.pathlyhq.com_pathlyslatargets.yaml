apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pathlyslatargets.pathly.pathlyhq.com
spec:
  group: pathly.pathlyhq.com
  names:
    kind: PathlySlaTarget
    listKind: PathlySlaTargetList
    plural: pathlyslatargets
    shortNames: [psla]
    singular: pathlyslatarget
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [connectionRef, objectivePct, windowDays]
              properties:
                connectionRef:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                monitorId: { type: string }
                name: { type: string }
                objectivePct: { type: number }
                windowDays: { type: integer, format: int64 }
                excludeMaintenance: { type: boolean }
                warnAtBudgetRatio: { type: number }
                enabled: { type: boolean }
            status:
              type: object
              properties:
                id: { type: string }
                monitorId: { type: string }
                name: { type: string }
                objectivePct: { type: number }
                windowDays: { type: integer, format: int64 }
                excludeMaintenance: { type: boolean }
                warnAtBudgetRatio: { type: number }
                enabled: { type: boolean }
                ready: { type: boolean }
                message: { type: string }
                observedGeneration: { type: integer, format: int64 }
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: ID
          type: string
          jsonPath: .status.id
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
