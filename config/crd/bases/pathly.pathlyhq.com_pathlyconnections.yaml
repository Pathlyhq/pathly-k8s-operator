apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pathlyconnections.pathly.pathlyhq.com
spec:
  group: pathly.pathlyhq.com
  names:
    kind: PathlyConnection
    listKind: PathlyConnectionList
    plural: pathlyconnections
    shortNames: [pcxn]
    singular: pathlyconnection
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [secretRef]
              properties:
                secretRef:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    key: { type: string }
                    optional: { type: boolean }
                baseURL:
                  type: string
            status:
              type: object
              properties:
                ready: { type: boolean }
                message: { type: string }
                observedGeneration: { type: integer, format: int64 }
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
